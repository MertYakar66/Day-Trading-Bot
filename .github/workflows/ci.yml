name: ci

# Keeps `main` releasable: lint + type-check, then the full pytest suite (incl. the
# SWE-dependent quant adapters) across supported Python versions. Everything is
# network-free and uses synthetic data only — no Theta, no broker.

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # no submodule needed: ruff lints, mypy ignores missing imports
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tools (pinned to match local/pre-commit)
        run: pip install ruff==0.15.0 mypy==1.19.1
      - name: Ruff (lint)
        run: ruff check intraday tests scripts
      - name: Mypy (type-check the package)
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout (with vendor/swe submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # The default GITHUB_TOKEN can only read THIS repo. If the
          # smart-wheel-engine submodule is private, create a repo-scoped PAT with
          # read access to it and add it as the secret SWE_SUBMODULE_TOKEN; the
          # line below then authenticates the submodule fetch. (Public submodule
          # needs no token.)
          token: ${{ secrets.SWE_SUBMODULE_TOKEN || github.token }}
          fetch-depth: 0

      # NB: deliberately NOT caching vendor/swe. The checkout above already fetches the
      # submodule at its pinned commit every run; a cache keyed on .gitmodules (which
      # does not contain the pinned SHA) would serve a STALE tree after a submodule bump.

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify SWE dependency imports
        run: python -c "import sys; sys.path.insert(0,'vendor/swe'); import engine.transaction_costs, engine.dealer_positioning, backtests.simulator; print('SWE imports OK')"

      - name: Run test suite
        run: pytest -q

      - name: Smoke-run the Phase-0 backtest
        run: python -m intraday backtest --start 2026-05-04 --end 2026-05-08

  package:
    # Builds the distribution and proves a clean `pip install` of the wheel works:
    # imports a module from EVERY subpackage + runs the console entry point, from
    # OUTSIDE the source tree so the installed package is exercised (not ./intraday).
    # This is the regression guard for the packaging metadata — a `packages` list
    # that drops subpackages passes every unit test but ships a broken wheel.
    # No vendor/swe needed: the SWE quant imports are lazy/in-function, so importing
    # the modules only requires the scientific stack (a backtest RUN still needs SWE).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # no submodule: importing the package does not import vendor/swe
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel into a clean venv and smoke-import every subpackage
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          PY="$RUNNER_TEMP/wheelenv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl numpy pandas scipy pyarrow
          # cd away from the repo so `import intraday` resolves to the INSTALLED wheel,
          # not the ./intraday source tree.
          cd "$RUNNER_TEMP"
          "$PY" -c "import intraday.backtest.engine, intraday.signals.registry, intraday.report.dashboard, intraday.eval.stats, intraday.data.parity, intraday.authority.gate, intraday.execution.paper_ledger, intraday.features.pipeline, intraday.risk.sizing, intraday.live.poller, intraday.metrics, intraday.costs; print('all subpackages import from the installed wheel')"
          "$RUNNER_TEMP/wheelenv/bin/intraday" --version
